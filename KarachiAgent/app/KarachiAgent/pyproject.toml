[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "KarachiAgent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.12"
# The AgentCore CodeZip build resolves wheels only, with source distribution
# builds disabled, so karachi_agent is vendored in by `make package` rather than
# declared as a git dependency. Keep these pins in step with the root pyproject.
dependencies = [
    "strands-agents==1.50.2",
    "httpx==0.28.1",
    "botocore[crt]==1.43.61",
    "bedrock-agentcore==1.19.0",
    "aws-opentelemetry-distro==0.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
